<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}WI-PlanArchiv{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  </head>
  <body>
    <header>
      <a class="brand" href="{{ url_for('web.index') }}" aria-label="WI-PlanArchiv – Startseite">
        <img src="{{ url_for('static', filename='brand.png') }}" alt="WI-PlanArchiv" width="1536" height="1024" fetchpriority="high">
      </a>
      <div class="hero-copy">{% block introduction %}{% endblock %}</div>
    </header>
    <main id="content">{% block content %}{% endblock %}</main>
    <footer>WI-PlanArchiv · Version V{{ app_version }}</footer>
  </body>
</html>
